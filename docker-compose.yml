services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:0.101
    restart: unless-stopped
    environment:
      # json-rpc keeps signal-cli running as a daemon and streams incoming
      # messages over a websocket, which is what the bridge consumes.
      - MODE=json-rpc
    ports:
      # Only reachable from this machine: the API has no authentication.
      - "127.0.0.1:8080:8080"
    volumes:
      # Signal account keys and data.
      - signal-cli-data:/home/.local/share/signal-cli
    # No-log policy: signal-cli prints every envelope it receives (contact
    # names, phone numbers, message contents) to stdout. Discard it.
    logging:
      driver: none

  # The bridge itself. Not started by a plain `docker compose up`: it needs
  # SIGNAL_NUMBER and a groups.txt, then run
  #   SIGNAL_NUMBER=+33... docker compose --profile bridge up -d --build
  bridge:
    profiles: ["bridge"]
    build: .
    restart: unless-stopped
    depends_on:
      - signal-api
    environment:
      - SIGNAL_NUMBER=${SIGNAL_NUMBER:-}
    command: ["-api", "http://signal-api:8080", "-linked-groups", "/groups.txt"]
    volumes:
      - ./groups.txt:/groups.txt:ro

volumes:
  signal-cli-data:
